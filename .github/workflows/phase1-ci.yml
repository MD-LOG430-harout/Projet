name: Phase 1 CI

on:
  push:
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.5.7
          python -m pip install \
            -r services/svc-clients-identite/requirements.txt \
            -r services/svc-conformite-audit/requirements.txt \
            -r services/svc-catalogue-offres/requirements.txt \
            -r services/svc-lignes-services/requirements.txt \
            -r services/svc-commandes-activations/requirements.txt \
            -r services/svc-usage-facturation/requirements.txt

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          mkdir -p artifacts

      - name: Lint Python syntax and critical undefined names
        run: |
          python -m compileall -q services tests
          ruff check --select E9,F63,F7,F82 services tests

      - name: Validate API and Compose contracts
        run: |
          python -m json.tool docs/api/postman/CanTelcoX-Phase1-Gateway.postman_collection.json > /dev/null
          docker compose config > artifacts/docker-compose.config.yml

      - name: Validate Phase 2 event foundations
        run: |
          python -m pytest -p no:cacheprovider tests/contracts tests/unit \
            --junitxml=artifacts/phase2-foundations-tests.xml

      - name: Run unit tests
        run: |
          python -m pytest -p no:cacheprovider \
            services/svc-clients-identite/tests \
            services/svc-conformite-audit/tests \
            services/svc-catalogue-offres/tests \
            services/svc-lignes-services/tests \
            services/svc-commandes-activations/tests \
            services/svc-usage-facturation/tests \
            --junitxml=artifacts/unit-tests.xml

      - name: Build service images
        run: docker compose build

      - name: Start Compose stack
        run: |
          docker compose up -d
          bash scripts/wait-compose-health.sh 300

      - name: Run integration tests
        run: |
          python -m pytest -p no:cacheprovider tests/integration \
            --junitxml=artifacts/integration-tests.xml

      - name: Run E2E gateway tests
        run: |
          python -m pytest -p no:cacheprovider tests/e2e \
            --junitxml=artifacts/e2e-tests.xml

      - name: Capture Docker logs
        if: always()
        run: |
          docker compose ps > artifacts/docker-compose.ps.txt || true
          docker compose logs --no-color > artifacts/docker-compose.logs.txt || true

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-ci-artifacts
          path: artifacts/
