name: Deploy VM

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action to run on the VM"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
          - status
      deploy_ref:
        description: "Git ref to deploy when action=deploy"
        required: true
        default: "main"
      app_dir:
        description: "Application directory on the VM"
        required: true
        default: "/opt/cantelcox"

jobs:
  deploy-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vm

    steps:
      - name: Validate action
        run: |
          case "${{ inputs.action }}" in
            deploy|rollback|status) ;;
            *) echo "Unsupported action: ${{ inputs.action }}" >&2; exit 2 ;;
          esac

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Trust VM host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deployment command on VM
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "APP_DIR='${{ inputs.app_dir }}' DEPLOY_REF='${{ inputs.deploy_ref }}' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone "${DEPLOY_REPOSITORY:-https://github.com/${{ github.repository }}.git}" "$APP_DIR"
          fi

          cd "$APP_DIR"
          bash scripts/deploy-vm.sh "${{ inputs.action }}"
          REMOTE
