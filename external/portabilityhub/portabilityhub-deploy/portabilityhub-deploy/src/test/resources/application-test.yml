spring:
  datasource:
    url: jdbc:h2:mem:portabilityhub-sync;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

portabilityhubsync:
  outbox:
    poll-interval-ms: 3600000
  port-completion:
    poll-interval-ms: 3600000
  simulator:
    enabled: true
