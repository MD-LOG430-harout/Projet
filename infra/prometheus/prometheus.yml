global:
  scrape_interval: 10s

scrape_configs:
  - job_name: svc-clients-identite
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-clients-identite:5000"]

  - job_name: svc-conformite-audit
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-conformite-audit:5000"]

  - job_name: svc-catalogue-offres
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-catalogue-offres:5000"]

  - job_name: svc-lignes-services
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-lignes-services:5000"]

  - job_name: svc-commandes-activations
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-commandes-activations:5000"]

  - job_name: svc-usage-facturation
    metrics_path: /metrics
    static_configs:
      - targets: ["svc-usage-facturation:5000"]
