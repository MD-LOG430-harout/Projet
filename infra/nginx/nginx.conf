events {}

http {
  upstream svc_clients_identite {
    server svc-clients-identite:5000;
  }

  upstream svc_conformite_audit {
    server svc-conformite-audit:5000;
  }

  upstream svc_catalogue_offres {
    server svc-catalogue-offres:5000;
  }

  upstream svc_lignes_services {
    server svc-lignes-services:5000;
  }

  upstream svc_commandes_activations {
    server svc-commandes-activations:5000;
  }

  upstream svc_usage_facturation {
    server svc-usage-facturation:5000;
  }

  server {
    listen 80;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, TraceId, X-Request-Id" always;
    add_header Access-Control-Expose-Headers "TraceId, X-Request-Id, Idempotency-Key" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header TraceId $http_traceid;
    proxy_set_header Idempotency-Key $http_idempotency_key;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = /_oauth2/introspect {
      internal;
      proxy_pass http://svc_clients_identite/v1/auth/introspect;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header TraceId $http_traceid;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location = /health {
      return 200 '{"status":"UP","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    location = /v1/customers/register {
      proxy_pass http://svc_clients_identite;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /v1/customers/ {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_clients_identite;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /v1/auth/ {
      proxy_pass http://svc_clients_identite;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location = /v1/audit-events {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_conformite_audit;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /v1/offers/ {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_catalogue_offres;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /v1/lines/ {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_lignes_services;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location = /v1/activations {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_commandes_activations;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }

    location = /v1/orders {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_commandes_activations;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location /v1/invoices {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_usage_facturation;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }
  }
}
