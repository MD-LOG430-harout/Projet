worker_processes auto;

events {
  worker_connections 8192;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:10m max_size=50m inactive=10m use_temp_path=off;
  access_log off;

  upstream svc_clients_identite {
    zone svc_clients_identite 64k;
    least_conn;
    server projet-svc-clients-identite-1:5000 resolve max_fails=0;
    server projet-svc-clients-identite-2:5000 resolve max_fails=0;
    server projet-svc-clients-identite-3:5000 resolve max_fails=0;
    keepalive 256;
  }

  upstream svc_conformite_audit {
    zone svc_conformite_audit 64k;
    least_conn;
    server svc-conformite-audit:5000 resolve max_fails=0;
    keepalive 256;
  }

  upstream svc_catalogue_offres {
    zone svc_catalogue_offres 64k;
    least_conn;
    server projet-svc-catalogue-offres-1:5000 resolve max_fails=0;
    server projet-svc-catalogue-offres-2:5000 resolve max_fails=0;
    server projet-svc-catalogue-offres-3:5000 resolve max_fails=0;
    server projet-svc-catalogue-offres-4:5000 resolve max_fails=0;
    server projet-svc-catalogue-offres-5:5000 resolve max_fails=0;
    server projet-svc-catalogue-offres-6:5000 resolve max_fails=0;
    keepalive 256;
  }

  upstream svc_lignes_services {
    zone svc_lignes_services 64k;
    least_conn;
    server svc-lignes-services:5000 resolve max_fails=0;
    keepalive 256;
  }

  upstream svc_commandes_activations {
    zone svc_commandes_activations 64k;
    least_conn;
    server projet-svc-commandes-activations-1:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-2:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-3:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-4:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-5:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-6:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-7:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-8:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-9:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-10:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-11:5000 resolve max_fails=0;
    server projet-svc-commandes-activations-12:5000 resolve max_fails=0;
    keepalive 256;
  }

  upstream svc_usage_facturation {
    zone svc_usage_facturation 64k;
    least_conn;
    server svc-usage-facturation:5000 resolve max_fails=0;
    keepalive 256;
  }

  server {
    listen 80;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, TraceId, X-Request-Id, traceparent" always;
    add_header Access-Control-Expose-Headers "TraceId, X-Request-Id, traceparent, Idempotency-Key, Location" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header TraceId $http_traceid;
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = /_oauth2/introspect {
      internal;
      proxy_pass http://svc_clients_identite/v1/auth/introspect;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header TraceId $http_traceid;
      proxy_cache auth_cache;
      proxy_cache_key $http_authorization;
      proxy_cache_valid 204 10m;
      proxy_cache_lock on;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location = /health {
      return 200 '{"status":"UP","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    location = /v1/customers/register {
      proxy_pass http://svc_clients_identite;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /v1/customers/ {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_clients_identite;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /v1/auth/ {
      proxy_pass http://svc_clients_identite;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location = /v1/audit-events {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_conformite_audit;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /v1/offers {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_catalogue_offres$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /v1/lines/ {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_lignes_services;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location = /v1/activations {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_commandes_activations$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }

    location = /v1/orders {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_commandes_activations$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location /v1/orders/ {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_commandes_activations$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location /v1/invoices {
      auth_request /_oauth2/introspect;
      proxy_pass http://svc_usage_facturation$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }
  }
}
